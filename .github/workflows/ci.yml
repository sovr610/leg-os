name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint (pyflakes + syntax)
        run: ruff check .
      - name: Validate configs
        run: m63 validate-configs
      - name: Tests (reference suite, excluding slow)
        run: pytest -m "not slow"
      - name: Model card matches the code
        run: |
          m63 card --config configs/full.yaml --out "$RUNNER_TEMP/MODEL_CARD.md"
          diff -u docs/MODEL_CARD.md "$RUNNER_TEMP/MODEL_CARD.md"
      - name: Release check (all non-negotiable gates)
        run: m63 release-check --json release-check.json --md release-check.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-check-py${{ matrix.python }}
          path: release-check.*
          if-no-files-found: ignore

