[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m63-omni"
version = "0.1.0"
description = "M63-Omni: reference implementation of a mid-tier hybrid (GDN/GQA) sparse-MoE native-multimodal orchestrator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
m63 = "m63_omni.cli:main"

[tool.setuptools.packages.find]
include = ["m63_omni*"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9"]  # pyflakes + syntax errors; style is not enforced

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
markers = [
    "slow: long-running reference tests (deselect with -m 'not slow')",
]
